<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Cloud</title>
    <script>
        // Prevent FOUC (Flash of Unstyled Content) / Dark Mode Flash
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen flex flex-col transition-colors duration-200" x-data="app()">
    
    <!-- Login Screen -->
    <template x-if="!authenticated">
        <div class="flex-grow flex items-center justify-center p-4">
            <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-md transition-colors duration-200">
                <h1 class="text-2xl font-bold mb-6 text-center text-gray-900 dark:text-white">Type Cloud 登录</h1>
                <form @submit.prevent="login">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">密码</label>
                        <input type="password" x-model="password" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 transition-colors duration-200" placeholder="输入密码" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md disabled:opacity-50 transition-colors duration-200" :disabled="loading">
                        <span x-text="loading ? '登录中...' : '登录'"></span>
                    </button>
                    <p x-show="error" x-text="error" class="mt-4 text-red-600 dark:text-red-400 text-center text-sm"></p>
                </form>
            </div>
        </div>
    </template>

    <!-- Main Interface -->
    <template x-if="authenticated">
        <div class="container mx-auto p-4 max-w-4xl">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800 dark:text-white">Type Cloud</h1>
                <div class="flex items-center space-x-4">
                    <!-- Dark Mode Toggle -->
                    <button @click="toggleDarkMode" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors duration-200">
                        <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                        <svg x-show="darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    </button>
                    <button @click="logout" class="text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300 font-medium transition-colors duration-200">登出</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Send Message -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm transition-colors duration-200">
                    <h2 class="text-xl font-semibold mb-4 text-gray-900 dark:text-white">发送消息</h2>
                    <form @submit.prevent="sendMessage">
                        <textarea 
                            x-model="message" 
                            rows="4" 
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 transition-colors duration-200"
                            placeholder="输入要发送的文本..."
                            @keydown.enter.prevent="sendMessage"
                        ></textarea>
                        
                        <!-- Control Buttons -->
                        <div class="grid grid-cols-5 gap-2 mb-4">
                            <button @click.prevent="sendCommand('left')" class="bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 py-2 rounded text-gray-700 dark:text-gray-200 font-bold transition-colors duration-200">←</button>
                            <button @click.prevent="sendCommand('right')" class="bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 py-2 rounded text-gray-700 dark:text-gray-200 font-bold transition-colors duration-200">→</button>
                            <button @click.prevent="sendCommand('backspace')" class="bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 py-2 rounded text-gray-700 dark:text-gray-200 transition-colors duration-200">退格</button>
                            <button @click.prevent="sendCommand('enter')" class="bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 py-2 rounded text-gray-700 dark:text-gray-200 transition-colors duration-200">回车</button>
                            <button @click.prevent="sendCommand('clear')" class="bg-red-50 dark:bg-red-900/30 hover:bg-red-100 dark:hover:bg-red-900/50 py-2 rounded text-red-600 dark:text-red-400 text-sm transition-colors duration-200">清空PC</button>
                        </div>

                        <button 
                            type="submit" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 px-4 rounded-md disabled:opacity-50 transition-colors duration-200"
                            :disabled="!message.trim() || sending"
                        >
                            <span x-text="sending ? '发送中...' : '发送到电脑'"></span>
                        </button>
                    </form>
                </div>

                <!-- History -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm transition-colors duration-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold text-gray-900 dark:text-white">历史记录</h2>
                        <button @click="loadHistory" class="text-sm bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-2 py-1 rounded text-gray-700 dark:text-gray-200 transition-colors duration-200">刷新</button>
                    </div>
                    <div class="space-y-2 max-h-64 overflow-y-auto pr-1">
                        <template x-for="msg in history" :key="msg.id">
                            <div class="p-3 bg-gray-50 dark:bg-gray-700/50 rounded border border-gray-200 dark:border-gray-700 transition-colors duration-200">
                                <div class="text-xs text-gray-500 dark:text-gray-400 mb-1" x-text="formatDate(msg.timestamp)"></div>
                                <div class="text-gray-800 dark:text-gray-200 break-words" x-text="msg.content"></div>
                            </div>
                        </template>
                        <div x-show="history.length === 0" class="text-gray-500 dark:text-gray-400 text-center py-4">暂无记录</div>
                    </div>
                </div>
            </div>

            <!-- Online Clients -->
            <div class="mt-8 bg-white dark:bg-gray-800 p-6 rounded-lg shadow-sm transition-colors duration-200">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-900 dark:text-white">在线客户端</h2>
                    <button @click="loadClients" class="text-sm bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-2 py-1 rounded text-gray-700 dark:text-gray-200 transition-colors duration-200">刷新</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <template x-for="client in clients" :key="client.id">
                        <div class="p-4 bg-green-50 dark:bg-green-900/20 rounded border border-green-200 dark:border-green-900/50 flex items-center justify-between transition-colors duration-200">
                            <div>
                                <div class="font-medium text-green-800 dark:text-green-300" x-text="'客户端 ' + client.id.substring(0,6)"></div>
                                <div class="text-xs text-green-600 dark:text-green-400" x-text="'上线: ' + formatDate(client.lastSeen)"></div>
                            </div>
                            <div class="h-2 w-2 bg-green-500 rounded-full animate-pulse"></div>
                        </div>
                    </template>
                    <div x-show="clients.length === 0" class="text-gray-500 dark:text-gray-400 py-2">暂无在线客户端</div>
                </div>
            </div>
        </div>
    </template>

    <script>
        function app() {
            return {
                authenticated: false,
                loading: false,
                sending: false,
                error: '',
                password: '',
                message: '',
                history: [],
                clients: [],
                token: null,
                socket: null,
                darkMode: localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches),

                init() {
                    // Auth Check
                    this.token = localStorage.getItem('authToken');
                    if (this.token) {
                        this.authenticated = true;
                        this.initSocket();
                        this.loadHistory();
                        this.loadClients();
                    }
                },

                toggleDarkMode() {
                    this.darkMode = !this.darkMode;
                    if (this.darkMode) {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    }
                },

                initSocket() {
                    // Initialize SocketIO client with type='web'
                    this.socket = io({ query: { type: 'web' } });
                    
                    this.socket.on('connect', () => {
                        console.log('Connected to WebSocket');
                    });

                    this.socket.on('message', (msg) => {
                        console.log('Received message:', msg);
                        // Refresh history when a new message is broadcasted
                        this.loadHistory(); 
                    });
                },

                async login() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: this.password })
                        });
                        
                        const data = await res.json();
                        
                        if (!res.ok) throw new Error(data.statusMessage || 'Login failed');
                        
                        this.token = data.token;
                        localStorage.setItem('authToken', this.token);
                        this.authenticated = true;
                        this.password = '';
                        this.initSocket();
                        this.loadHistory();
                        this.loadClients();
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                logout() {
                    this.authenticated = false;
                    this.token = null;
                    localStorage.removeItem('authToken');
                    if (this.socket) this.socket.disconnect();
                },

                async sendMessage() {
                    if (!this.message.trim()) return;
                    
                    this.sending = true;
                    try {
                        const res = await fetch('/api/message', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            },
                            body: JSON.stringify({ 
                                content: this.message.trim(),
                                clientId: 'web-client'
                            })
                        });

                        if (!res.ok) {
                            const data = await res.json();
                            if (res.status === 401) this.logout();
                            throw new Error(data.statusMessage || 'Failed to send');
                        }

                        this.message = '';
                        // this.loadHistory(); // Triggered by SocketIO event instead
                    } catch (e) {
                        alert('发送失败: ' + e.message);
                    } finally {
                        this.sending = false;
                    }
                },

                async sendCommand(action) {
                    try {
                        const res = await fetch('/api/command', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            },
                            body: JSON.stringify({ action })
                        });
                        if (res.status === 401) this.logout();
                    } catch (e) {
                        console.error('Failed to send command:', e);
                    }
                },

                async loadHistory() {
                    try {
                        const res = await fetch('/api/history', {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.status === 401) return this.logout();
                        this.history = await res.json();
                        // Sort by ID (timestamp) desc
                        this.history.sort((a, b) => b.id - a.id);
                    } catch (e) {
                        console.error(e);
                    }
                },

                async loadClients() {
                    try {
                        const res = await fetch('/api/clients', {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.status === 401) return this.logout();
                        this.clients = await res.json();
                    } catch (e) {
                        console.error(e);
                    }
                },

                formatDate(isoString) {
                    if (!isoString) return '';
                    return new Date(isoString).toLocaleString();
                }
            }
        }
    </script>
</body>
</html>
