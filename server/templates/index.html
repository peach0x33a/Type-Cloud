<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col" x-data="app()">
    
    <!-- Login Screen -->
    <template x-if="!authenticated">
        <div class="flex-grow flex items-center justify-center p-4">
            <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
                <h1 class="text-2xl font-bold mb-6 text-center">Type Cloud 登录</h1>
                <form @submit.prevent="login">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <input type="password" x-model="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="输入密码" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 disabled:opacity-50" :disabled="loading">
                        <span x-text="loading ? '登录中...' : '登录'"></span>
                    </button>
                    <p x-show="error" x-text="error" class="mt-4 text-red-600 text-center text-sm"></p>
                </form>
            </div>
        </div>
    </template>

    <!-- Main Interface -->
    <template x-if="authenticated">
        <div class="container mx-auto p-4 max-w-4xl">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Type Cloud</h1>
                <button @click="logout" class="text-red-600 hover:text-red-800 font-medium">登出</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Send Message -->
                <div class="bg-white p-6 rounded-lg shadow-sm">
                    <h2 class="text-xl font-semibold mb-4">发送消息</h2>
                    <form @submit.prevent="sendMessage">
                        <textarea 
                            x-model="message" 
                            rows="4" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
                            placeholder="输入要发送的文本..."
                            @keydown.enter.prevent="sendMessage"
                        ></textarea>
                        
                        <!-- Control Buttons -->
                        <div class="grid grid-cols-5 gap-2 mb-4">
                            <button @click.prevent="sendCommand('left')" class="bg-gray-100 hover:bg-gray-200 py-2 rounded text-gray-700 font-bold">←</button>
                            <button @click.prevent="sendCommand('right')" class="bg-gray-100 hover:bg-gray-200 py-2 rounded text-gray-700 font-bold">→</button>
                            <button @click.prevent="sendCommand('backspace')" class="bg-gray-100 hover:bg-gray-200 py-2 rounded text-gray-700">退格</button>
                            <button @click.prevent="sendCommand('enter')" class="bg-gray-100 hover:bg-gray-200 py-2 rounded text-gray-700">回车</button>
                            <button @click.prevent="sendCommand('clear')" class="bg-red-50 hover:bg-red-100 py-2 rounded text-red-600 text-sm">清空PC</button>
                        </div>

                        <button 
                            type="submit" 
                            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 disabled:opacity-50"
                            :disabled="!message.trim() || sending"
                        >
                            <span x-text="sending ? '发送中...' : '发送到电脑'"></span>
                        </button>
                    </form>
                </div>

                <!-- History -->
                <div class="bg-white p-6 rounded-lg shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold">历史记录</h2>
                        <button @click="loadHistory" class="text-sm bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-700">刷新</button>
                    </div>
                    <div class="space-y-2 max-h-64 overflow-y-auto pr-1">
                        <template x-for="msg in history" :key="msg.id">
                            <div class="p-3 bg-gray-50 rounded border border-gray-200">
                                <div class="text-xs text-gray-500 mb-1" x-text="formatDate(msg.timestamp)"></div>
                                <div class="text-gray-800 break-words" x-text="msg.content"></div>
                            </div>
                        </template>
                        <div x-show="history.length === 0" class="text-gray-500 text-center py-4">暂无记录</div>
                    </div>
                </div>
            </div>

            <!-- Online Clients -->
            <div class="mt-8 bg-white p-6 rounded-lg shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">在线客户端</h2>
                    <button @click="loadClients" class="text-sm bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded text-gray-700">刷新</button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <template x-for="client in clients" :key="client.id">
                        <div class="p-4 bg-green-50 rounded border border-green-200 flex items-center justify-between">
                            <div>
                                <div class="font-medium text-green-800" x-text="'客户端 ' + client.id.substring(0,6)"></div>
                                <div class="text-xs text-green-600" x-text="'上线: ' + formatDate(client.lastSeen)"></div>
                            </div>
                            <div class="h-2 w-2 bg-green-500 rounded-full animate-pulse"></div>
                        </div>
                    </template>
                    <div x-show="clients.length === 0" class="text-gray-500 py-2">暂无在线客户端</div>
                </div>
            </div>
        </div>
    </template>

    <script>
        function app() {
            return {
                authenticated: false,
                loading: false,
                sending: false,
                error: '',
                password: '',
                message: '',
                history: [],
                clients: [],
                token: null,
                socket: null,

                init() {
                    this.token = localStorage.getItem('authToken');
                    if (this.token) {
                        this.authenticated = true;
                        this.initSocket();
                        this.loadHistory();
                        this.loadClients();
                    }
                },

                initSocket() {
                    // Initialize SocketIO client with type='web'
                    this.socket = io({ query: { type: 'web' } });
                    
                    this.socket.on('connect', () => {
                        console.log('Connected to WebSocket');
                    });

                    this.socket.on('message', (msg) => {
                        console.log('Received message:', msg);
                        // Refresh history when a new message is broadcasted
                        this.loadHistory(); 
                    });
                },

                async login() {
                    this.loading = true;
                    this.error = '';
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: this.password })
                        });
                        
                        const data = await res.json();
                        
                        if (!res.ok) throw new Error(data.statusMessage || 'Login failed');
                        
                        this.token = data.token;
                        localStorage.setItem('authToken', this.token);
                        this.authenticated = true;
                        this.password = '';
                        this.initSocket();
                        this.loadHistory();
                        this.loadClients();
                    } catch (e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                logout() {
                    this.authenticated = false;
                    this.token = null;
                    localStorage.removeItem('authToken');
                    if (this.socket) this.socket.disconnect();
                },

                async sendMessage() {
                    if (!this.message.trim()) return;
                    
                    this.sending = true;
                    try {
                        const res = await fetch('/api/message', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            },
                            body: JSON.stringify({ 
                                content: this.message.trim(),
                                clientId: 'web-client'
                            })
                        });

                        if (!res.ok) {
                            const data = await res.json();
                            if (res.status === 401) this.logout();
                            throw new Error(data.statusMessage || 'Failed to send');
                        }

                        this.message = '';
                        // this.loadHistory(); // Triggered by SocketIO event instead
                    } catch (e) {
                        alert('发送失败: ' + e.message);
                    } finally {
                        this.sending = false;
                    }
                },

                async sendCommand(action) {
                    try {
                        const res = await fetch('/api/command', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${this.token}`
                            },
                            body: JSON.stringify({ action })
                        });
                        if (res.status === 401) this.logout();
                    } catch (e) {
                        console.error('Failed to send command:', e);
                    }
                },

                async loadHistory() {
                    try {
                        const res = await fetch('/api/history', {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.status === 401) return this.logout();
                        this.history = await res.json();
                        // Sort by ID (timestamp) desc
                        this.history.sort((a, b) => b.id - a.id);
                    } catch (e) {
                        console.error(e);
                    }
                },

                async loadClients() {
                    try {
                        const res = await fetch('/api/clients', {
                            headers: { 'Authorization': `Bearer ${this.token}` }
                        });
                        if (res.status === 401) return this.logout();
                        this.clients = await res.json();
                    } catch (e) {
                        console.error(e);
                    }
                },

                formatDate(isoString) {
                    if (!isoString) return '';
                    return new Date(isoString).toLocaleString();
                }
            }
        }
    </script>
</body>
</html>
